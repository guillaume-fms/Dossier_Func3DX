<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Materialize CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css" />
    <link rel="stylesheet" href="style.css
    " />
    <title>Document Regex</title>
</head>

<body>
    <div class="surfer">🏄‍♀️</div>
    <div class="title">
        <h1>Hello, welcome on my Regex form. &#128540;</h1>
    </div>
    <br>
    <div class="container">
        <h4>Form registation which using <span>REGEXP</span></h4>
        <form>
            <div class="input-container">
                <label for="FullName">FullName : </label>
                <input type="text" id="FullName" placeholder="Enter Your Full Name" required />
            </div>
            <br>
            <div class="input-container">
                <label for="PhoneNumber">Phone Number : </label>
                <input type="text" id="PhoneNumber" placeholder="Enter Your Phone Number" required />
            </div>
            <br>
            <div class="input-container">
                <label for="ZipCode">Zip Code : </label>
                <input type="text" id="ZipCode" placeholder="Enter Your Zip Code" required />
            </div>
            <br>
            <div class="input-container">
                <label for="Password">Password : </label>
                <input type="password" id="Password" placeholder="Create Your Password" required />
            </div>
            <br>
            <div class="input-container">
                <label for="Email">Email : </label>
                <input type="text" id="Email" placeholder="Enter your Email" required />
            </div>
            <br>
            <input type="submit" value="Submit" class="btn green" id="submitBtn" />
        </form>
    </div>
    <div class="footer">
        <footer>

        </footer>
    </div>
